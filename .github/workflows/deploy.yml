name: Deploy to AWS App Runner

# Automates docs/deployment-runbook.md §1-2/§6 (build → push to ECR → trigger App Runner
# redeployment) on every push to main. See that doc for the manual/CLI/Console equivalent of
# every step here, and for the HOSTNAME/health-check gotcha this build depends on staying fixed.
#
# Required repository secrets (Settings → Secrets and variables → Actions → New repository
# secret) — set these once, never committed:
#   AWS_ACCESS_KEY_ID       - the agent-deploy IAM user's access key
#   AWS_SECRET_ACCESS_KEY   - the agent-deploy IAM user's secret key
#
# Everything else below (account id, region, repo/service names) is not secret — it's the same
# public configuration already visible in docs/deployment-runbook.md and this repo's ADRs.

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: vibe-coding-hit
  ECR_REGISTRY: 462977977759.dkr.ecr.us-east-1.amazonaws.com
  APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:us-east-1:462977977759:service/vibe-coding-hit/55ad382ce7d442d98fe82d32e8b4e158

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

      - name: Trigger App Runner deployment
        run: |
          aws apprunner start-deployment --service-arn "$APP_RUNNER_SERVICE_ARN" --region "$AWS_REGION"

      - name: Wait for deployment to go healthy
        run: |
          for i in $(seq 1 40); do
            status=$(aws apprunner describe-service --service-arn "$APP_RUNNER_SERVICE_ARN" --region "$AWS_REGION" --query "Service.Status" --output text)
            echo "Poll $i: $status"
            if [ "$status" = "RUNNING" ]; then exit 0; fi
            if [[ "$status" == *"FAILED"* ]]; then echo "Deployment failed"; exit 1; fi
            sleep 15
          done
          echo "Timed out waiting for RUNNING status"; exit 1
